function mdSection(open){return `<div class="sg-md-head"><p class="sg-sec-label">会员日专享</p><button class="sg-md-collapse" data-action="md-toggle" aria-expanded="${open}">${open?'收起':'展开'}<i data-lucide="${open?'chevron-up':'chevron-down'}" aria-hidden="true"></i></button></div>${open?MD_PRODUCTS.map(mdProduct).join('')+'<p class="sg-hint" data-mdcd></p>':'<p class="sg-md-short">每月 1/11/21 会员日当天开放：500 积分兑 24 小时，1000 积分兑 7×24 小时。</p>'}`}
function pgExchange(){return '<div class="sg-page">'+topBar('积分兑换','<button class="sg-textbtn" data-action="go-payment"><i data-lucide="gem" aria-hidden="true"></i>直接购买</button>')+`<section class="sg-big-card"><div><div class="sg-pts-row"><i data-lucide="coins" aria-hidden="true"></i><span>当前可用积分</span></div><p class="sg-pts-num">${s.points}<small>分</small></p></div><span class="sg-pts-mark"><i data-lucide="crown" aria-hidden="true"></i></span></section><p class="sg-expiry${valid()?'':' warn'}">${valid()?'会员有效至 '+expiryFull():'会员已到期，兑换成功后立即生效'}</p>${debugRow()}<p class="sg-sec-label">兑换会员时长</p>${EX_PRODUCTS.map(prod).join('')}${mdSection(mdShown())}<div class="sg-rule-line"></div><p class="sg-hint">兑换后立即生效，未使用也计有效期；会员有效期内兑换将顺延到期时间。</p></div>`}
function rec(r){const e=r.type==='earn';return `<div class="sg-rec${e?'':' spend'}"><span class="sg-rec-mark"><i data-lucide="${e?'circle-arrow-up':'circle-arrow-down'}" aria-hidden="true"></i></span><span class="sg-rec-body"><b>${r.title}</b><small>${r.time}</small></span><span class="sg-rec-amt">${e?'+':'-'}${r.amount}</span></div>`}
function sumCard(items,total){return `<button class="sg-sum" data-action="sum-toggle" aria-expanded="${s.histOpen}"><span class="sg-sum-l"><span class="sg-sum-mark"><i data-lucide="trending-up" aria-hidden="true"></i></span><span><small>截止 ${fmtDay(Date.now())}</small><b>共获取 <em>${total}</em> 积分</b></span></span><span class="sg-sum-r">${s.histOpen?'收起':'查看明细'}<i data-lucide="${s.histOpen?'chevron-up':'chevron-down'}" aria-hidden="true"></i></span></button>${s.histOpen?`<div class="sg-sum-detail">${items.map(([t,v],k)=>`<div><span><i>${k+1}</i>${t}</span><b>+${v}</b></div>`).join('')}</div>`:''}`}
function pgHistory(){const e=s.histTab==='earn',list=s.ledger.filter(r=>e?r.type==='earn':r.type==='spend').slice(0,50),g={};list.forEach(r=>{g[r.title]=(g[r.title]||0)+r.amount});const items=Object.entries(g).sort((x,y)=>y[1]-x[1]),total=items.reduce((n,x)=>n+x[1],0);return '<div class="sg-page">'+topBar('积分明细')+`<div class="sg-segtabs${e?'':' spend'}" role="group" aria-label="积分明细分类"><button data-action="hist-tab" data-hist="earn" aria-pressed="${e}">获取</button><button data-action="hist-tab" data-hist="spend" aria-pressed="${!e}">消耗</button></div>${e&&items.length?sumCard(items,total):''}${list.length?list.map(rec).join(''):`<div class="sg-empty"><i data-lucide="${e?'circle-arrow-up':'clock'}" aria-hidden="true"></i>暂无${e?'获取':'消耗'}记录</div>`}${list.length?`<p class="sg-list-end">仅显示最近 ${list.length} 条记录</p>`:''}</div>`}
function mailCard(){const b=s.mail.ok;return `<div class="sg-bcard mail"><div class="sg-bcard-top"><span class="sg-bcard-mark"><i data-lucide="mail" aria-hidden="true"></i></span><span class="sg-bcard-name"><b>订阅福利活动通知</b>${b?'':'<span class="sg-tag-now">秒到账</span>'}</span></div><p class="sg-bcard-desc">${b?'已订阅成功，福利活动通知将发送至你的邮箱':'1 分钟完成 · 限量福利、会员日活动邮件提醒，积分立即到账'}</p><div class="sg-bcard-foot"><span class="sg-bcard-reward"><i data-lucide="gift" aria-hidden="true"></i>+1000 积分</span>${b?'<span class="sg-bcard-state ok"><i data-lucide="circle-check-big" aria-hidden="true"></i>已订阅</span>':'<button class="sg-bcard-btn" data-action="go-mail">去订阅<i data-lucide="chevron-right" aria-hidden="true"></i></button>'}</div></div>`}
function taskCard(t){const m={pending:['去完成','chevron-right','go-submit',''],submitted:['审核中','clock','',''],approved:['领取奖励','gift','claim',''],claimed:['已赠送','circle-check-big','','done'],rejected:['重新提交','circle-arrow-up','go-submit','']}[t.status],state=t.status==='submitted'||t.status==='claimed';return `<article class="sg-bcard"><div class="sg-bcard-top"><span class="sg-bcard-mark"><i data-lucide="gift" aria-hidden="true"></i></span><span class="sg-bcard-name"><b>${t.name}</b></span></div>${t.desc?`<p class="sg-bcard-desc">${t.desc}</p>`:''}${t.sub?`<div class="sg-times"><div><i data-lucide="calendar" aria-hidden="true"></i>提审时间 ${fmtMD(stamp(...t.sub))}</div><div><i data-lucide="shield-check" aria-hidden="true"></i>审核时间 ${fmtMD(stamp(...t.rev))}</div>${t.claim?`<div><i data-lucide="gift" aria-hidden="true"></i>领取时间 ${fmtMD(stamp(...t.claim))}</div>`:''}</div>`:''}${t.status==='rejected'&&t.why?`<div class="sg-reject"><p>${t.why}</p></div>`:''}<div class="sg-bcard-foot"><span class="sg-bcard-reward${t.status==='claimed'?' off':''}"><i data-lucide="coins" aria-hidden="true"></i>+${t.label}</span>${state?`<span class="sg-bcard-state ${m[3]}"><i data-lucide="${m[1]}" aria-hidden="true"></i>${m[0]}</span>`:`<button class="sg-bcard-btn" data-action="${m[2]}" data-id="${t.id}">${m[0]}<i data-lucide="${m[1]}" aria-hidden="true"></i></button>`}</div></article>`}
function pgBenefits(){const todo=[mailCard()].concat(s.benTasks.filter(t=>t.status==='pending'||t.status==='submitted').map(taskCard)),done=s.benTasks.filter(t=>t.status==='approved'||t.status==='claimed'||t.status==='rejected').map(taskCard),isTodo=s.benTab==='todo',list=isTodo?todo:done;return '<div class="sg-page">'+topBar('限量福利')+`<div class="sg-tabs" role="group" aria-label="福利任务分类"><button data-action="ben-tab" data-ben="todo" aria-pressed="${isTodo}">进行中<span class="sg-count">${todo.length}</span></button><button data-action="ben-tab" data-ben="done" aria-pressed="${!isTodo}">已完成<span class="sg-count">${done.length}</span></button></div>${list.length?list.join(''):`<div class="sg-empty"><i data-lucide="${isTodo?'circle-check-big':'clock'}" aria-hidden="true"></i>${isTodo?'暂无进行中的任务':'暂无已完成的任务'}</div>`}<p class="sg-hint">提交后客服将在 1-3 个工作日内审核 · 审核通过后需手动领取积分</p></div>`}
function pgSubmit(){const t=s.benTasks.find(x=>x.id===s.submitId)||s.benTasks[0];if(s.submitted)return '<div class="sg-page">'+topBar(`ID${t.id}-任务提审`)+`<div class="sg-success"><span class="sg-success-mark"><i data-lucide="circle-check-big" aria-hidden="true"></i></span><b>提交成功</b><p>您的审核材料已提交，客服将在 1-3 个工作日内完成审核</p><p>审核通过后，请返回手动领取 ${t.label}</p></div><button class="sg-primary" data-action="submit-back">返回福利列表</button><p class="sg-hint">审核结果将通过站内消息通知你</p></div>`;return '<div class="sg-page">'+topBar(`ID${t.id}-任务提审`)+`<article class="sg-bcard"><div class="sg-bcard-top"><span class="sg-bcard-mark"><i data-lucide="gift" aria-hidden="true"></i></span><span class="sg-bcard-name"><b>${t.name}</b></span></div>${t.desc?`<p class="sg-bcard-desc">${t.desc}</p>`:''}<div class="sg-bcard-foot"><span class="sg-bcard-reward"><i data-lucide="coins" aria-hidden="true"></i>奖励</span><span class="sg-reward-big">${t.label}</span></div></article>${t.flow.length?`<article class="sg-bcard"><h3 class="sg-card-title"><i data-lucide="list" aria-hidden="true"></i>任务流程</h3>${flow(t.flow)}</article>`:''}<article class="sg-bcard"><h3 class="sg-card-title"><i data-lucide="image" aria-hidden="true"></i>上传凭证<small>最多 5 个</small></h3><div class="sg-uploads">${s.uploads.map((u,i)=>`<span class="sg-up"><i data-lucide="image" aria-hidden="true"></i><span>${u}</span><button class="sg-up-x" data-action="up-del" data-i="${i}" aria-label="删除 ${u}"><i data-lucide="x" aria-hidden="true"></i></button></span>`).join('')}${s.uploads.length<5?'<button class="sg-up-add" data-action="up-add"><i data-lucide="upload" aria-hidden="true"></i>添加凭证</button>':''}</div></article><article class="sg-bcard"><h3 class="sg-card-title"><i data-lucide="file-text" aria-hidden="true"></i>任务完成补充<small>选填</small></h3><textarea class="sg-area" data-note="1" aria-label="任务完成补充" placeholder="请描述任务完成情况，如遇到问题请说明...">${esc(s.submitNote)}</textarea></article><button class="sg-primary" data-action="submit-do" ${s.uploads.length?'':'disabled'}>${s.uploads.length?`ID${t.id}-任务提审`:'请先上传凭证'}</button><p class="sg-hint">提交后客服将在 1-3 个工作日内审核 · 审核通过后需手动领取积分</p></div>`}
function sendTxt(){return s.mail.busy?'发送中...':s.mail.cd>0?s.mail.cd+'s':s.mail.sent?'重新发送':'获取验证码'}
function pgMail(){if(s.mail.ok)return '<div class="sg-page">'+topBar('邮箱订阅')+`<div class="sg-success"><span class="sg-success-mark"><i data-lucide="mail" aria-hidden="true"></i></span><b>订阅成功</b><p>福利活动通知将发送至</p><p>${esc(s.mail.email)}</p><span class="sg-got"><i data-lucide="coins" aria-hidden="true"></i>+1000 积分已到账</span></div><button class="sg-primary" data-action="pop">返回积分会员</button><p class="sg-hint">可随时在邮箱中退订活动通知</p></div>`;return '<div class="sg-page">'+topBar('邮箱订阅')+`<div class="sg-mail-hero"><span class="sg-mail-mark"><i data-lucide="mail" aria-hidden="true"></i><em>+1000 积分</em></span><b>订阅福利活动通知</b><p>限量福利与会员日活动，第一时间提醒你</p></div><div class="sg-perks"><div class="sg-perk"><i data-lucide="bell-ring" aria-hidden="true"></i>限量福利开放提醒，先到先得不错过</div><div class="sg-perk"><i data-lucide="coins" aria-hidden="true"></i>订阅成功立即到账 1000 积分</div><div class="sg-perk"><i data-lucide="shield-check" aria-hidden="true"></i>仅用于活动通知，可随时退订</div></div><div class="sg-field"><i data-lucide="mail" aria-hidden="true"></i><input type="email" id="sg-mail" aria-label="邮箱地址" placeholder="请输入邮箱地址" autocomplete="email" value="${esc(s.mail.email)}"><span class="sg-field-ok" id="sg-mail-ok"${mailValid()?'':' hidden'}><i data-lucide="circle-check-big" aria-hidden="true"></i></span></div><div class="sg-field-row"><div class="sg-field"><input type="text" class="sg-code-input" id="sg-mcode" aria-label="验证码" inputmode="numeric" maxlength="6" placeholder="验证码" autocomplete="one-time-code" value="${esc(s.mail.code)}"></div><button class="sg-send" data-action="send-code" ${s.mail.busy||s.mail.cd>0||!mailValid()?'disabled':''}>${sendTxt()}</button></div><div class="sg-spam"><i data-lucide="info" aria-hidden="true"></i><span>收不到邮件？请检查<b>垃圾邮件</b>或<b>广告邮件</b>文件夹</span></div><p class="sg-form-err" data-mailerr role="alert">${s.mail.err}</p><label class="sg-consent"><input type="checkbox" id="sg-mail-agree"${s.mail.agree?' checked':''}><span>我已阅读并同意用户协议与隐私政策，同意接收活动通知邮件</span></label><button class="sg-primary" data-action="mail-verify" ${s.mail.busy?'disabled':''}>${s.mail.busy?'验证中...':'确认订阅'}</button><p class="sg-hint">演示环境：获取验证码后，验证码为 ${DEMO_CODE}</p><div class="sg-demo-toast"${s.mail.demo?'':' hidden'}><i data-lucide="info" aria-hidden="true"></i>【演示】验证码为 <b>${DEMO_CODE}</b></div></div>`}
function pgShare(){return '<div class="sg-page">'+topBar('分享好友','<button class="sg-textbtn" data-action="go-sharedetail"><i data-lucide="list" aria-hidden="true"></i>分享明细</button>')+`<section class="sg-share-hero"><span class="sg-crown-mark"><i data-lucide="crown" aria-hidden="true"></i><em><i data-lucide="sparkles" aria-hidden="true"></i></em></span><b>邀好友，赚积分</b><p>好友注册得 100 积分，你同步得 100 积分</p></section><div class="sg-code-bar"><span><small>我的邀请码</small><b>${INVITE_CODE}</b></span><button class="sg-copy-btn${s.inviteCopied?' ok':''}" data-action="copy-invite"><i data-lucide="${s.inviteCopied?'check':'copy'}" aria-hidden="true"></i>${s.inviteCopied?'已复制':'复制'}</button></div><button class="sg-share-btn${s.shareCopied?' ok':''}" data-action="copy-share"><i data-lucide="${s.shareCopied?'circle-check-big':'share-2'}" aria-hidden="true"></i>${s.shareCopied?'邀请文案已复制':'复制邀请文案并分享'}</button><section class="sg-bcard"><h3 class="sg-card-title"><i data-lucide="star" aria-hidden="true"></i>活动规则</h3><div class="sg-rule-item"><span class="sg-rule-mark">+100</span><span><b>好友注册成功，你得 100 积分</b><small>好友通过你的邀请码或链接完成注册并登录，积分立即到账</small></span></div><div class="sg-rule-item"><span class="sg-rule-mark">1:1</span><span><b>好友也得 100 积分</b><small>平台 1:1 同步赠送，好友注册即得，双方都有份</small></span></div><p class="sg-rule-note">同一设备或同一 CID 重复注册不计入；邀请无上限，邀越多赚越多。</p></section><section class="sg-bcard"><h3 class="sg-card-title"><i data-lucide="users" aria-hidden="true"></i>参与方式</h3><div class="sg-join-steps"><div class="sg-join-step"><span class="sg-step-num">1</span><p><b>复制邀请文案</b>，分享给微信、QQ 或社交平台好友</p></div><div class="sg-join-step"><span class="sg-step-num">2</span><p>好友<b>下载上谷游戏加速器</b>，注册时填写你的邀请码</p></div><div class="sg-join-step"><span class="sg-step-num">3</span><p>注册成功后<b>双方各得 100 积分</b>，可在分享明细查看</p></div></div></section>${qqRow()}<p class="sg-hint">分享明细中的 UID 与时间均为演示数据</p></div>`}
function pgShareDetail(){const n=SHARE_RECORDS.length;return '<div class="sg-page">'+topBar('分享明细')+`<section class="sg-sum2"><div class="sg-cutoff"><i data-lucide="calendar" aria-hidden="true"></i>统计截止至 ${fmtDay(Date.now())}</div><div class="sg-stats"><div class="sg-stat"><span class="sg-stat-mark"><i data-lucide="users" aria-hidden="true"></i></span><span><small>累计分享注册</small><b>${n} 人</b></span></div><span class="sg-stat-sep" aria-hidden="true"></span><div class="sg-stat"><span class="sg-stat-mark"><i data-lucide="trending-up" aria-hidden="true"></i></span><span><small>贡献积分</small><b>${n*100} 分</b></span></div></div></section><section class="sg-list-card">${SHARE_RECORDS.map(([u,d,h,mi],i)=>`<div class="sg-srec"><span class="sg-srec-idx">${i+1}</span><span class="sg-srec-l"><b>UID ${u}</b><small>${fmtMD(stamp(d,h,mi))}</small></span><span class="sg-srec-tag">已注册</span></div>`).join('')}</section><p class="sg-hint">仅展示最近 ${n} 条分享记录 · 积分以实际到账为准</p></div>`}
function planRow(p,i){const name=p[0],mins=p[1],price=p[2],per=p[3],badge=p[4],sel=s.payPlan===i;return `<button class="sg-plan" data-action="pay-plan" data-pay="${i}" aria-pressed="${sel}">${badge?`<span class="sg-plan-badge">${badge}</span>`:''}<span class="sg-plan-mark"><i data-lucide="${mins>=129600?'gem':mins>=43200?'calendar':'zap'}" aria-hidden="true"></i></span><span class="sg-plan-l"><b>${name}</b><small>${per}</small></span><span class="sg-plan-r"><i>¥</i>${price}</span></button>`}
function pgPayment(){const st=s.payState;return '<div class="sg-page">'+topBar('直接购买')+`<aside class="sg-ad-slot" aria-label="广告位">广告位</aside><div class="sg-feat-row"><span class="sg-feat"><i data-lucide="shield-check" aria-hidden="true"></i><b>去广告</b><small>无开屏横幅</small></span><span class="sg-feat"><i data-lucide="zap" aria-hidden="true"></i><b>双模式</b><small>全局或单游戏</small></span><span class="sg-feat"><i data-lucide="globe" aria-hidden="true"></i><b>多线路</b><small>智能优选节点</small></span></div><p class="sg-sec-label">选择套餐</p>${PAY_PLANS.map(planRow).join('')}<p class="sg-sec-label">支付方式</p><button class="sg-pay-method" data-action="pay-method" aria-pressed="true"><span class="sg-alipay" aria-hidden="true">支</span><b>支付宝</b><span class="sg-radio" aria-hidden="true"></span></button><button class="sg-pay-btn${st==='paying'?' busy':st==='success'?' ok':''}" data-action="pay"${st!=='idle'?' disabled':''}>${st==='paying'?'<span class="sg-spin"><i data-lucide="circle-play" aria-hidden="true"></i></span>支付中...':st==='success'?'<i data-lucide="circle-check-big" aria-hidden="true"></i>支付成功':`立即支付 ¥${PAY_PLANS[s.payPlan][2]}`}</button><div class="sg-notice"><b><i data-lucide="info" aria-hidden="true"></i>重要说明</b><ul><li>会员时长自支付成功时起算，未使用也计有效期</li><li>已有会员时购买将顺延到期时间</li><li>虚拟商品一经开通不支持退款</li></ul></div></div>`}
function earnSub(){const p=page();return p==='exchange'?pgExchange():p==='history'?pgHistory():p==='benefits'?pgBenefits():p==='submit'?pgSubmit():p==='mail'?pgMail():p==='share'?pgShare():p==='sharedetail'?pgShareDetail():p==='payment'?pgPayment():earnHome()}
function buy(list,i,key){const item=list[i],name=item[0],mins=item[1],pts=item[2];if(s.exBusy!==null)return;if(spend(pts,name+'会员',mins)){s.exBusy=key;render();clearTimeout(exTimer);exTimer=setTimeout(()=>{s.exBusy=null;s.exOk=key;render();sheet('兑换成功',`<p>${name}会员已生效，当前余额 ${s.points} 积分。</p><p>有效至 ${expiryFull()}（北京时间）</p>`,`<button class="sg-primary" data-action="back-boost">${s.active?'返回加速':'去加速'}</button>`)},1200)}else notify('积分不足，先去看广告赚积分')}

if(a==='claim'){const t=s.benTasks.find(x=>x.id===Number(b.dataset.id));if(!t||t.status!=='approved')return;const n=new Date();t.status='claimed';t.claim=[0,n.getHours(),n.getMinutes()];earn(parseInt(t.label,10)||0,'限量福利奖励');render();notify(t.label+'已到账');return}
